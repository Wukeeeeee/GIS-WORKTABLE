[pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*
addopts = -v --tb=short
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    unit: Layer 1 单元测试 (Prompt、上下文、参数解析，快速纯逻辑测试)
    agent: Layer 2 Agent 测试 (真实 Graph、意图、工具选择、上下文继承、零追问)
    gis_tools: Layer 3 GIS 工具集成测试 (空间计算、边界查询、真实绘图)
    map_integration: Layer 4 地图集成测试 (图层注册、元数据、前后端接口交互)
    e2e: Layer 5 端到端业务测试 (用户输入 -> Agent -> 工具 -> 图层注册 -> 交付)
    fast: 快速测试集合 (Layer 1 + Layer 2)
    integration: 集成测试集合 (Layer 3 + Layer 4)
    regression: 完整回归测试 (全层级全量测试)
filterwarnings =
    ignore::DeprecationWarning:rasterio.*
    ignore:Setting the shape on a NumPy array has been deprecated:DeprecationWarning
    ignore:.*Using `httpx` with `starlette.testclient`.*
    ignore::starlette.testclient.StarletteDeprecationWarning
