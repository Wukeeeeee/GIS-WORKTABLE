# ============================================================
# GIS-WORKTABLE docker-compose.yml
# 一键启动：docker-compose up --build
# ============================================================
services:
  web:
    build: .
    container_name: gis-worktable
    ports:
      - "8000:8000"
    volumes:
      # 开发模式：挂载源码，修改后重启容器即生效
      - ./backend:/app/backend
      - ./frontend:/app/frontend
      - ./knowledge:/app/knowledge
      - ./skills:/app/skills
      # 持久化：上传文件、输出报告、对话历史
      - ./uploads:/app/uploads
      - ./output:/app/output
      - ./cache:/app/cache
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
    restart: unless-stopped
